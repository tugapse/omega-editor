@if (_selectedObject) {
  <editor-inpector-toggle-panel
    [title]="
      _selectedObject.key.capitalize() + ' ' + _selectedObject.property.name
    "
    [collapsed]="true"
  >
    @if (texture) {
      <div class="texture-container">
        <div class="texture-preview">
          <img [src]="texture.textureUri" />
        </div>
        <div class="enums">
          <editor-enum-inspector
            [label]="'Filter Mode'"
            [items]="_enums['minFilter']"
            [selected]="texture.minFilter"
            (change)="onTextureEnumChange('filter', $event)"
          ></editor-enum-inspector>
          <editor-enum-inspector
            [label]="'Wrap Mode'"
            [items]="_enums['wrapT']"
            [selected]="texture.wrapS"
            (change)="onTextureEnumChange('wrap', $event)"
          ></editor-enum-inspector>
        </div>
      </div>
    }
    @for (item of _properties; track $index) {
      @switch (item.type) {
        @case ("object") {
          <editor-object-inspector
            [label]="item.key.capitalize() + ' ' + item.value.name"
            [isChild]="true"
            [targetObject]="{
              key: item.key,
              type: item.type,
              property: item.value,
            }"
          ></editor-object-inspector>
        }
        @default {
          <editor-default-inspector
            [item]="item"
            (change)="onDefaultChanged(item, $event)"
          ></editor-default-inspector>
        }
      }
    }
  </editor-inpector-toggle-panel>
}
