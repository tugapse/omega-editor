@if (_selectedObject) {
  <editor-inpector-toggle-panel
    [title]="_selectedObject.property.name || 'Material'"
    [collapsed]="true"
  >
    @for (key of textureKeys; track key) {
      <editor-texture-slot
        [label]="key.capitalize()"
        [texture]="textureOf(key)"
        (textureSelected)="onTextureSelected(key, $event)"
      ></editor-texture-slot>
      @if (textureOf(key); as tex) {
        <editor-texture-inspector
          [label]="key.capitalize() + ' ' + tex.name"
          [isChild]="true"
          [targetObject]="{ key: key, type: 'texture', property: tex }"
        ></editor-texture-inspector>
      }
    }
    @for (item of _properties; track $index) {
      @switch (item.type) {
        @case ("texture") {
          <editor-texture-inspector
            [label]="item.key.capitalize() + ' ' + item.value.name"
            [isChild]="true"
            [targetObject]="{
              key: item.key,
              type: item.type,
              property: item.value,
            }"
          ></editor-texture-inspector>
        }
        @case ("object") {
          <editor-object-inspector
            [label]="item.key.capitalize() + ' ' + item.value.name"
            [isChild]="true"
            [targetObject]="{
              key: item.key,
              type: item.type,
              property: item.value,
            }"
          ></editor-object-inspector>
        }
        @default {
          <editor-default-inspector
            [item]="item"
            (change)="onDefaultChanged(item, $event)"
          ></editor-default-inspector>
        }
      }
    }
  </editor-inpector-toggle-panel>
}
